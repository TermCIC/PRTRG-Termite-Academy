<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Termite Academy Progress</title>
<meta name="description" content="Planning status for the 1st PRTRG Termite Academy, 4–6 May 2027.">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Open+Sans:wght@400;600&display=swap">
<style>
:root {
  --paper: #ffffff;
  --surface: #f6f8fa;
  --line: #dde4ea;
  --line-solid: #b9c6d2;
  --ink: #0a0a0a;
  --body: #26333d;
  --muted: #5f7484;
  --blue: #1165a4;
  --blue-deep: #0c4a7a;
  --blue-soft: #e3edf6;
  --green: #3f7539;   --green-soft: #e4eee2;
  --amber: #9a6a10;   --amber-soft: #f6eddc;
  --navy: #223c5e;    --navy-soft: #e2e7f0;
  --grey: #5f7484;    --grey-soft: #eef1f4;
  --f-display: 'Montserrat', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Open Sans', 'Segoe UI', system-ui, sans-serif;
  --pad: clamp(1rem, 4vw, 3.5rem);
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--body); font-family: var(--f-body); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--f-display); color: var(--ink); margin: 0; line-height: 1.15; font-weight: 700; text-wrap: balance; }
p { margin: 0; }
a { color: var(--blue); }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 2px; }
.eyebrow { font-family: var(--f-display); font-size: .813rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--blue); }

.topbar { position: sticky; top: 0; z-index: 50; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.topbar-inner { max-width: 64rem; margin: 0 auto; padding: .55rem var(--pad); display: flex; align-items: center; gap: 1.5rem; }
.topbar .logo img { display: block; height: 28px; width: auto; }
.topnav { margin-left: auto; display: flex; gap: 1.15rem; }
.topnav a { font-family: var(--f-display); font-size: .813rem; font-weight: 500; color: var(--muted); text-decoration: none; padding: .35rem 0; border-bottom: 2px solid transparent; white-space: nowrap; }
.topnav a:hover { color: var(--blue); border-bottom-color: var(--blue); }

.cover { border-top: 6px solid var(--blue); border-bottom: 1px solid var(--line); }
.cover-inner { max-width: 64rem; margin: 0 auto; padding: clamp(2rem, 5vw, 3.25rem) var(--pad) clamp(1.75rem, 4vw, 2.5rem); display: flex; flex-direction: column; gap: 1.2rem; }
.cover-logo { width: 230px; max-width: 60%; height: auto; display: block; margin-bottom: .25rem; }
.cover h1 { font-size: clamp(2.2rem, 1.4rem + 3.4vw, 3.6rem); letter-spacing: -.02em; max-width: 16ch; }
.cover h1 em { font-style: normal; display: block; color: var(--blue); font-weight: 600; }
.cover-meta { display: flex; flex-wrap: wrap; gap: 0 2.5rem; border-top: 2px solid var(--blue); padding-top: 1rem; margin-top: .25rem; }
.cover-meta > div { display: flex; flex-direction: column; padding-block: .4rem; }
.meta-k { font-family: var(--f-display); font-size: .7rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.meta-v { font-family: var(--f-display); font-size: 1.2rem; font-weight: 600; color: var(--ink); }

.wrap { max-width: 64rem; margin: 0 auto; padding: 1.75rem var(--pad) 3rem; }
section + section { margin-top: 2.25rem; }
.sec-head { display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
.sec-head h2 { font-size: 1.25rem; padding-bottom: .45rem; border-bottom: 2px solid var(--blue); }

/* status pills: icon + label, never colour alone */
.pill { display: inline-flex; align-items: center; gap: .35rem; font-family: var(--f-display); font-size: .68rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: .25rem .55rem; border-radius: 999px; white-space: nowrap; }
.pill::before { font-size: .8rem; letter-spacing: 0; }
.pill.done    { background: var(--green-soft); color: var(--green); }  .pill.done::before    { content: "✓"; }
.pill.doing   { background: var(--blue-soft);  color: var(--blue-deep); } .pill.doing::before { content: "●"; }
.pill.waiting { background: var(--amber-soft); color: var(--amber); }  .pill.waiting::before { content: "⏳"; }
.pill.todo    { background: var(--grey-soft);  color: var(--grey); }   .pill.todo::before    { content: "○"; }

/* today */
.today { background: var(--surface); border-left: 4px solid var(--blue); border-radius: 0 6px 6px 0; padding: 1rem 1.2rem; }
.today h3 { font-size: .95rem; margin-bottom: .5rem; }
.today ul { margin: 0; padding-left: 1.1rem; }
.today li + li { margin-top: .25rem; }

/* areas */
.areas { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 19rem), 1fr)); gap: 1rem; }
.area { border: 1px solid var(--line); border-radius: 6px; padding: 1rem 1.1rem 1.05rem; display: flex; flex-direction: column; gap: .7rem; box-shadow: 0 1px 2px rgba(10,20,30,.05), 0 8px 24px -16px rgba(10,20,30,.25); }
.area-head { display: flex; justify-content: space-between; align-items: flex-start; gap: .75rem; }
.area h3 { font-size: 1rem; }
.k { font-family: var(--f-display); font-size: .64rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: .1rem; }
.latest .date { font-weight: 600; color: var(--ink); }
.next { border-top: 1px solid var(--line); padding-top: .6rem; }
.next p { color: var(--ink); }

/* filters */
.filters { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
.filters button { font-family: var(--f-display); font-size: .75rem; font-weight: 600; color: var(--muted); background: var(--paper); border: 1px solid var(--line-solid); border-radius: 999px; padding: .3rem .75rem; cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; }

/* log */
.log { border-collapse: collapse; width: 100%; font-size: .9rem; }
.log td { padding: .5rem .5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
.log td:first-child { white-space: nowrap; font-weight: 600; color: var(--ink); width: 8.5rem; }
.log td:nth-child(2) { color: var(--muted); font-size: .8rem; width: 11rem; }
@media (max-width: 600px) {
  .log tr { display: grid; grid-template-columns: auto 1fr; }
  .log td { border-bottom: none; padding: .15rem .3rem; }
  .log td:nth-child(3) { grid-column: 1 / -1; border-bottom: 1px solid var(--line); padding-bottom: .55rem; }
  .log td:first-child, .log td:nth-child(2) { width: auto; }
}
.note { font-size: .8rem; color: var(--muted); margin-top: .8rem; }
</style>
</head>

(function () {
  var LOGO_LABELS = { done: 'Done', doing: 'In progress', waiting: 'Waiting on reply', todo: 'Not started' };
  var ORDER = ['waiting', 'doing', 'todo', 'done'];
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  function fmtDate(iso) {
    var d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function pill(st) { return '<span class="pill ' + st + '">' + LOGO_LABELS[st] + '</span>'; }

  // meta
  var days = Math.round((new Date(EVENT_DATE + 'T00:00:00') - new Date(UPDATED + 'T00:00:00')) / 86400000);
  var counts = {}; AREAS.forEach(function (a) { counts[a.status] = (counts[a.status] || 0) + 1; });
  $('meta').innerHTML =
    '<div><span class="meta-k">Updated</span><span class="meta-v">' + fmtDate(UPDATED) + '</span></div>' +
    '<div><span class="meta-k">Days to go</span><span class="meta-v">' + days + '</span></div>' +
    ORDER.map(function (s) { return '<div><span class="meta-k">' + LOGO_LABELS[s] + '</span><span class="meta-v">' + (counts[s] || 0) + '</span></div>'; }).join('');

  // today
  var todays = LOG.filter(function (l) { return l[0] === UPDATED; });
  $('today-h').textContent = 'Latest · ' + fmtDate(UPDATED);
  $('today-list').innerHTML = todays.map(function (l) { return '<li><strong>' + esc(l[1]) + ':</strong> ' + esc(l[2]) + '</li>'; }).join('');

  // filters + areas
  var current = 'all';
  function drawAreas() {
    var list = AREAS.slice().sort(function (a, b) { return ORDER.indexOf(a.status) - ORDER.indexOf(b.status); })
      .filter(function (a) { return current === 'all' || a.status === current; });
    $('areas').innerHTML = list.map(function (a) {
      return '<article class="area">' +
        '<div class="area-head"><h3>' + esc(a.area) + '</h3>' + pill(a.status) + '</div>' +
        '<div class="latest"><span class="k">Latest</span><p><span class="date">' + fmtDate(a.latest[0]) + '</span> · ' + esc(a.latest[1]) + '</p></div>' +
        '<div class="next"><span class="k">Next step</span><p>' + esc(a.next) + '</p></div>' +
      '</article>';
    }).join('');
  }
  var opts = [['all', 'All']].concat(ORDER.map(function (s) { return [s, LOGO_LABELS[s] + ' (' + (counts[s] || 0) + ')']; }));
  $('filters').innerHTML = opts.map(function (o) { return '<button type="button" data-f="' + o[0] + '" aria-pressed="' + (o[0] === 'all') + '">' + o[1] + '</button>'; }).join('');
  $('filters').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    current = b.getAttribute('data-f');
    Array.prototype.forEach.call(this.querySelectorAll('button'), function (x) { x.setAttribute('aria-pressed', x === b); });
    drawAreas();
  });
  drawAreas();

  // log
  $('log').innerHTML = LOG.map(function (l) {
    return '<tr><td>' + fmtDate(l[0]) + '</td><td>' + esc(l[1]) + '</td><td>' + esc(l[2]) + '</td></tr>';
  }).join('');
})();
